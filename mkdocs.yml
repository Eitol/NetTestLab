site_name: NetTestLab Documentation
site_description: Network simulation platform for mobile application testing
site_url: https://nettestlab.github.io/docs

repo_name: nettestlab/nettestlab
repo_url: https://github.com/Eitol/NetTestLab

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation/index.md
    - Quick Start: installation/quickstart.md
  - API Reference:
    - Overview: api/index.md
    - Network Control: api/network.md
    - Profiles: api/profiles.md
  - Client Libraries:
    - JavaScript/TypeScript: clients/javascript.md
    - Python: clients/python.md
    - Java: clients/java.md
    - Dart/Flutter: clients/dart.md
    - Go: clients/go.md
  - Examples:
    - Basic Usage: examples/basic.md
    - CI/CD Integration: examples/cicd.md
    - Mobile Testing: examples/mobile.md
  - OpenWRT:
    - Installation: openwrt/installation.md
    - Configuration: openwrt/configuration.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google