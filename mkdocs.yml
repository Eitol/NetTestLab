site_name: NetTestLab Documentation
site_description: Network simulation platform for mobile application testing on OpenWrt routers
site_url: https://eitol.github.io/NetTestLab/

repo_name: Eitol/NetTestLab
repo_url: https://github.com/Eitol/NetTestLab
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/favicon.ico

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Eitol/NetTestLab
    - icon: fontawesome/solid/globe
      link: https://eitol.github.io/NetTestLab/
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/overview.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Network Profiles: user-guide/profiles.md
    - Network Conditions: user-guide/conditions.md
    - WiFi Auto-Discovery: user-guide/wifi-discovery.md
    - Monitoring: user-guide/monitoring.md
  - API Reference:
    - Overview: api/overview.md
    - Network Control Service: api/network-service.md
    - Profile Service: api/profile-service.md
    - Monitoring Service: api/monitoring-service.md
    - gRPC Protocol: api/grpc.md
  - Client Libraries:
    - Overview: clients/overview.md
    - Go Client: clients/go.md
    - JavaScript/TypeScript: clients/javascript.md
    - Python: clients/python.md
    - Java: clients/java.md
    - Dart/Flutter: clients/dart.md
  - Examples:
    - Basic Usage: examples/basic.md
    - Mobile App Testing: examples/mobile-testing.md
    - CI/CD Integration: examples/cicd.md
    - Custom Profiles: examples/custom-profiles.md
  - OpenWrt:
    - Installation: openwrt/installation.md
    - Package Building: openwrt/building.md
    - Configuration: openwrt/configuration.md
    - Troubleshooting: openwrt/troubleshooting.md
  - Development:
    - Contributing: development/contributing.md
    - Building from Source: development/building.md
    - Testing: development/testing.md
    - Architecture: development/architecture.md

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
  - minify:
      minify_html: true